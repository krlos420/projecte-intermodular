name: comp-together

services:
  php:
    build: ./php
    user: 1000:1000
    volumes:
      - ./src:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: comp-together
      DB_USERNAME: root
      DB_PASSWORD: administrador
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: administrador
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno
      MYSQL_DATABASE: comp-together
    volumes:
      - comp-together:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  comp-together:
